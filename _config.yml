title: Declan's learning nook
description: Welcome!
remote_theme: "jekyll/minima@1e8a445"
collections:
  misc:
    output: true

plugins:
  - jekyll-seo-tag

# Optional: default image for posts/pages without one
defaults:
  - scope: {path: ""}                  # whole site
    values:
      image: /favicon.png

markdown: kramdown

kramdown:
  toc_levels: 2..6   # which heading levels to include (optional, but nice)