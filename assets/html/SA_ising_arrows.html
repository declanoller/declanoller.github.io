function xy_to_arrow(d){

  if (d.state==1){
    var a = [[ 0.25 ,  0.075],
       [ 0.   ,  0.375],
       [-0.25 ,  0.075],
       [-0.1  ,  0.075],
       [-0.1  , -0.375],
       [ 0.1  , -0.375],
       [ 0.1  ,  0.075],
       [ 0.25 ,  0.075]];
  }
  else{
    var a = [[-0.25 , -0.075],
       [ 0.   , -0.375],
       [ 0.25 , -0.075],
       [ 0.1  , -0.075],
       [ 0.1  ,  0.375],
       [-0.1  ,  0.375],
       [-0.1  , -0.075],
       [-0.25 , -0.075]];
  }
  //return a.map(el => [x_ising_arrows(el[0]), y_ising_arrows(el[1])]);
  return a.map(el => [x_ising_arrows(el[0] + d.x), y_ising_arrows(el[1] + d.y)]);
}

function hamiltonian(){

  var E = 0;

  for (var ind=0; ind<spins_dat_arrows.length; ind++){

    var x = spins_dat_arrows[ind].x;
    var y = spins_dat_arrows[ind].y;
    var s = spins_dat_arrows[ind].state;

    if (x > 0){
      E += -spins_dict_arrows[x-1][y]*s;
    }
    if (x < N_spins_arrows-1){
      E += -spins_dict_arrows[x+1][y]*s;
    }
    if (y > 0){
      E += -spins_dict_arrows[x][y-1]*s;
    }
    if (y < N_spins_arrows-1){
      E += -spins_dict_arrows[x][y+1]*s;
    }

  }

  return E;
}


function flip_state_arrows(){
  var ind = Math.round(Math.random()*(N_spins_arrows*N_spins_arrows - 1));

  var x = spins_dat_arrows[ind].x;
  var y = spins_dat_arrows[ind].y;
  var s = spins_dat_arrows[ind].state;

  var E_switch = 0;
  if (x > 0){
    E_switch += spins_dict_arrows[x-1][y]*s;
  }
  if (x < N_spins_arrows-1){
    E_switch += spins_dict_arrows[x+1][y]*s;
  }
  if (y > 0){
    E_switch += spins_dict_arrows[x][y-1]*s;
  }
  if (y < N_spins_arrows-1){
    E_switch += spins_dict_arrows[x][y+1]*s;
  }



  T_arrows = slider_temp_ising_arrows.value()*T_arrows;
  T_history_arrows.push({
      index: T_history_arrows[T_history_arrows.length - 1].index + 1,
      x: T_history_arrows[T_history_arrows.length - 1].x + 1,
      y: T_arrows
    });

  var p_mut = Math.exp(-E_switch/T_arrows);

  if (p_mut > Math.random()){

    spins_dat_arrows[ind].state = s*-1;
    spins_dict_arrows[x][y] = spins_dat_arrows[ind].state;
    //svg_ising_arrows.selectAll('g').selectAll('path')
    svg_ising_arrows.selectAll('g')
      .filter(function (d, i) {return i === ind;})
      .selectAll('path')
      .style("fill", function (d){ if(d.state==1){return down_col;}else{return up_col;}})
      .each(arrow);

    E_tot_arrows += E_switch;
  }


  E_history_arrows.push({
      index: E_history_arrows[E_history_arrows.length - 1].index + 1,
      x: E_history_arrows[E_history_arrows.length - 1].x + 1,
      y: E_tot_arrows
    });


  //console.log(E_history_arrows);
  plot_E_arrows.select('path').attr('d', line_E_arrows);

  x_E_arrows.domain(d3.extent(E_history_arrows.map(el => el.x)));
  svg_E_arrows.select(".x")
    .call(xAxis_E_arrows);

  y_E_arrows.domain(d3.extent(E_history_arrows.map(el => el.y)));
  svg_E_arrows.select(".y")
    .call(yAxis_E_arrows);

  plot_T_arrows.select('path').attr('d', line_T_arrows);
  x_T_arrows.domain(d3.extent(T_history_arrows.map(el => el.x)));
  svg_T_arrows.select(".x")
    .call(xAxis_T_arrows);

  y_T_arrows.domain(d3.extent(T_history_arrows.map(el => el.y)));
  svg_T_arrows.select(".y")
    .call(yAxis_T_arrows);

  text_T_arrows.text( function(d){
    if (d.label == 'status'){
      return ('T = ' + T_arrows.toExponential(3));
    }
    else{
      return d.txt;
    }
  })


  text_E_arrows.text( function(d){
    if (d.label == 'status'){
      return ('Total energy = ' + E_tot_arrows.toFixed(1));
    }
    else{
      return d.txt;
    }
  })


}



function run_sim_ising_arrows(){

  var delay_amount = trans_dur;
  //var delay_amount = 3;
  for (i=0; i<N_flips_arrows; i++){
    //spins_dat_arrows[i].state = spins_dat_arrows[i].state*-1;
    setTimeout(flip_state_arrows, delay_amount * i);
    //flip_state_arrows();
  }
}


function reset_sim_ising_arrows(){

  T_arrows = T_init_arrows;

  var spins_dat_arrows_new;
  [spins_dat_arrows_new, spins_dict_arrows] = reset_spins_arrows();

  for (j=0; j<spins_dat_arrows_new.length; j++){
    spins_dat_arrows[j].state = spins_dat_arrows_new[j].state;
  }

  E_tot_arrows = hamiltonian();

  E_history_arrows = [{
      index: 0,
      x: 0,
      y: E_tot_arrows
    }];


  T_history_arrows = [{
      index: 0,
      x: 0,
      y: T_init_arrows
    }];

  svg_ising_arrows.selectAll('g').selectAll('path')
    .style("fill", function (d){ if(d.state==1){return down_col;}else{return up_col;}})
    .each(arrow);

    x_E_arrows.domain(d3.extent(E_history_arrows.map(el => el.x)));
    svg_E_arrows.select(".x")
      .call(xAxis_E_arrows);

    y_E_arrows.domain(d3.extent(E_history_arrows.map(el => el.y)));
    svg_E_arrows.select(".y")
      .call(yAxis_E_arrows);

    plot_T_arrows.select('path').attr('d', line_T_arrows);
    x_T_arrows.domain(d3.extent(T_history_arrows.map(el => el.x)));
    svg_T_arrows.select(".x")
      .call(xAxis_T_arrows);

    y_T_arrows.domain(d3.extent(T_history_arrows.map(el => el.y)));
    svg_T_arrows.select(".y")
      .call(yAxis_T_arrows);


    plot_E_arrows.select("path")
        .datum(E_history_arrows)
        .attr("fill", "none")
        .attr("stroke", "mediumseagreen")
        .attr("stroke-linejoin", "round")
        .attr("stroke-linecap", "round")
        .attr("stroke-width", 2.5)
        .attr("d", line_E_arrows);

    plot_T_arrows.select("path")
        .datum(T_history_arrows)
        .attr("fill", "none")
        .attr("stroke", "tomato")
        .attr("stroke-linejoin", "round")
        .attr("stroke-linecap", "round")
        .attr("stroke-width", 2.5)
        .attr("d", line_T_arrows);


  text_T_arrows.text( function(d){
    if (d.label == 'status'){
      return ('T = ' + T_arrows.toExponential(3));
    }
    else{
      return d.txt;
    }
  })


  text_E_arrows.text( function(d){
    if (d.label == 'status'){
      return ('Total energy = ' + E_tot_arrows.toFixed(1));
    }
    else{
      return d.txt;
    }
  })

}


function reset_spins_arrows(){

  var spins_dat_arrows = [];
  var spins_dict_arrows = {};
  for (i=0; i<N_spins_arrows; i++){
    spins_dict_arrows[i] = {};
    for (j=0; j<N_spins_arrows; j++){
      var exp = Math.round(20*Math.random());
      var s = Math.pow(-1, exp);
      spins_dat_arrows.push({
        x : i,
        y : j,
        state : s
      })

      spins_dict_arrows[i][j] = s;

    }
  }

  return [spins_dat_arrows, spins_dict_arrows];

}
