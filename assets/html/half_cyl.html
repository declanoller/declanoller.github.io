<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Three.js: warped plane + rounded-rect hole (shader cutout, fixed)</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#0b0f14; }
    canvas { display:block; }
    #hud{
      position:fixed; left:12px; top:12px; z-index:10;
      color:rgba(255,255,255,0.86);
      font:12px ui-monospace, SFMono-Regular, Menlo, monospace;
      background:rgba(0,0,0,0.28);
      padding:8px 10px;
      border-radius:10px;
      user-select:none;
      line-height:1.25;
    }
  </style>
</head>
<body>
<div id="hud">
  Drag: orbit · Scroll: zoom<br/>
  PlaneGeometry warp (z(x)) + shader cutout (rounded outer + rounded hole)
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* -------------------- Parameters -------------------- */

// Overall “frame” size in XY
const OUTER_W = 4.2;
const OUTER_H = 2.4;
const OUTER_R = 0.25;   // set 0 for sharp outer corners

// Hole size in XY
const INNER_W = 2.8;
const INNER_H = 1.3;
const INNER_R = 0.05;   // set 0 for sharp hole corners

// Grid density (higher = smoother warp)
const SEG_X = 400;      // bend direction
const SEG_Y = 200;

// Half-cylinder: edges at z=0, peak at z=R
const CYLINDER_RADIUS = OUTER_W / 2;

/* -------------------- Build warped plane geometry -------------------- */

const geom = new THREE.PlaneGeometry(OUTER_W, OUTER_H, SEG_X, SEG_Y);

const pos = geom.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i); // in [-OUTER_W/2, OUTER_W/2]
  const t = Math.max(0, CYLINDER_RADIUS*CYLINDER_RADIUS - x*x);
  const z = Math.sqrt(t);
  pos.setZ(i, z);
}
pos.needsUpdate = true;
geom.computeVertexNormals();

/* -------------------- Material with cutout in shader (FIXED) -------------------- */

const mat = new THREE.MeshStandardMaterial({
  color: 0x9bdcff,
  metalness: 0.12,
  roughness: 0.33,
  side: THREE.DoubleSide,
  alphaTest: 0.5,     // important: enables discard when alpha < alphaTest
  transparent: false  // fine; alphaTest still works
});

mat.onBeforeCompile = (shader) => {
  shader.uniforms.uOuterSize = { value: new THREE.Vector2(OUTER_W/2, OUTER_H/2) };
  shader.uniforms.uInnerSize = { value: new THREE.Vector2(INNER_W/2, INNER_H/2) };
  shader.uniforms.uOuterR = { value: OUTER_R };
  shader.uniforms.uInnerR = { value: INNER_R };

  // Pass local XY into fragment shader
  shader.vertexShader = shader.vertexShader
    .replace(
      "#include <common>",
      `#include <common>
       varying vec2 vLocalXY;`
    )
    .replace(
      "#include <begin_vertex>",
      `#include <begin_vertex>
       vLocalXY = position.xy;`
    );

  // SDF for rounded rectangle centered at origin
  const sdfCode = `
    varying vec2 vLocalXY;
    uniform vec2 uOuterSize;
    uniform vec2 uInnerSize;
    uniform float uOuterR;
    uniform float uInnerR;

    float sdRoundRect(vec2 p, vec2 b, float r) {
      vec2 q = abs(p) - b + vec2(r);
      return length(max(q, 0.0)) - r + min(max(q.x, q.y), 0.0);
    }

    float sdRect(vec2 p, vec2 b) {
      return max(abs(p.x) - b.x, abs(p.y) - b.y);
    }
  `;

  shader.fragmentShader = shader.fragmentShader
    .replace(
      "#include <common>",
      `#include <common>
       ${sdfCode}`
    )
    // ✅ Key fix: apply alpha mask BEFORE the alphatest chunk runs
    .replace(
      "#include <alphatest_fragment>",
      `
      // --- Cutout mask in local XY (applied BEFORE alphatest) ---
      float sdOuter = (uOuterR > 0.0)
        ? sdRoundRect(vLocalXY, uOuterSize, uOuterR)
        : sdRect(vLocalXY, uOuterSize);

      float sdInner = (uInnerR > 0.0)
        ? sdRoundRect(vLocalXY, uInnerSize, uInnerR)
        : sdRect(vLocalXY, uInnerSize);

      float aaO = fwidth(sdOuter) * 1.5;
      float aaI = fwidth(sdInner) * 1.5;

      // 1 inside outer, 0 outside
      float maskOuter = 1.0 - smoothstep(0.0, aaO, sdOuter);

      // 0 inside hole, 1 outside
      float maskHole  = smoothstep(0.0, aaI, sdInner);

      float mask = clamp(maskOuter * maskHole, 0.0, 1.0);
      diffuseColor.a *= mask;

      #include <alphatest_fragment>
      `
    );
};

/* -------------------- Scene setup -------------------- */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b0f14, 10, 40);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 200);
camera.position.set(0, 1.2, 8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.25);
sun.position.set(3, 4, 6);
scene.add(sun);

const mesh = new THREE.Mesh(geom, mat);
scene.add(mesh);

scene.add(new THREE.AxesHelper(2));

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
