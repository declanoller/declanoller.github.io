<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Three.js XRHandMeshModel + Finger Count</title>
	<style>
		html, body { margin: 0; height: 100%; background: #0b0e14; overflow: hidden; font-family: system-ui, sans-serif; }
		#hud {
			position: fixed; left: 12px; top: 12px; z-index: 10;
			padding: 10px 12px; border-radius: 10px;
			background: rgba(0,0,0,.55); color: #fff; line-height: 1.3;
			backdrop-filter: blur(6px);
		}
		#hud b { font-size: 20px; }
		#hud .muted { opacity: .8; font-size: 12px; }
		#hud .mode { opacity: .9; font-size: 12px; margin-top: 6px; }
	</style>
</head>
<body>
	<div id="hud">
		<div>Fingers: <b id="count">–</b></div>
		<div class="muted">Enter XR → show your hand → extend fingers to count 1–5.</div>
		<div class="mode" id="mode">Mode: –</div>
	</div>

	<script type="importmap">
	{
		"imports": {
			"three": "https://unpkg.com/three@0.161.0/build/three.module.js",
			"three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
		}
	}
	</script>

	<script type="module">
		import * as THREE from "three";
		import { VRButton } from "three/addons/webxr/VRButton.js";
		import { OrbitControls } from "three/addons/controls/OrbitControls.js";
		import { XRHandModelFactory } from "three/addons/webxr/XRHandModelFactory.js";
		// Note: XRHandModelFactory's "mesh" path uses XRHandMeshModel as documented:
		// https://threejs.org/docs/#XRHandMeshModel

		const hudCount = document.getElementById("count");
		const hudMode = document.getElementById("mode");

		const scene = new THREE.Scene();
		scene.background = new THREE.Color(0x0b0e14);

		const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 50);
		camera.position.set(0, 1.6, 1.5);

		const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
		renderer.setPixelRatio(window.devicePixelRatio);
		renderer.setSize(window.innerWidth, window.innerHeight);
		renderer.xr.enabled = true;
		document.body.appendChild(renderer.domElement);

		// Only show VR button when WebXR sessions are supported (prevents dead button on many desktops)
		(async () => {
			const ok = !!(navigator.xr && await navigator.xr.isSessionSupported?.("immersive-vr"));
			if (ok) document.body.appendChild(VRButton.createButton(renderer));
			else hudMode.textContent = "Mode: Non‑XR demo (no WebXR immersive-vr support detected)";
		})();

		const controls = new OrbitControls(camera, renderer.domElement);
		controls.target.set(0, 1.35, 0);
		controls.update();

		// Simple lighting for the hand mesh
		scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.0));
		const dir = new THREE.DirectionalLight(0xffffff, 0.8);
		dir.position.set(2, 4, 2);
		scene.add(dir);

		// Reference floor
		const floor = new THREE.Mesh(
			new THREE.PlaneGeometry(10, 10),
			new THREE.MeshStandardMaterial({ color: 0x10151f, roughness: 1 })
		);
		floor.rotation.x = -Math.PI / 2;
		floor.position.y = 0;
		scene.add(floor);

		// XR Hand + XRHandMeshModel (via factory)
		const handFactory = new XRHandModelFactory();
		const hand1 = renderer.xr.getHand(0);
		scene.add(hand1);
		const hand1MeshModel = handFactory.createHandModel(hand1, "mesh");
		hand1.add(hand1MeshModel);

		// ---------- Non‑XR fallback hand (simple rig) ----------
		function createDemoHand() {
			const g = new THREE.Group();
			g.position.set(0, 1.35, 0);
			g.rotation.y = Math.PI; // face camera

			const matPalm = new THREE.MeshStandardMaterial({ color: 0x2a6ee8, roughness: 0.6, metalness: 0.05 });
			const matFinger = new THREE.MeshStandardMaterial({ color: 0x3aa0ff, roughness: 0.6, metalness: 0.05 });

			const palm = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.035, 0.12), matPalm);
			palm.position.set(0, 0, 0);
			g.add(palm);

			const fingers = []; // each entry = [j1, j2, j3] joint pivots
			const fingerBaseX = [-0.05, -0.02, 0.01, 0.04]; // index..pinky
			const fingerNames = ["index", "middle", "ring", "pinky"];

			function makeFinger(basePos, isThumb = false) {
				const root = new THREE.Group();
				root.position.copy(basePos);
				g.add(root);

				const segGeo = new THREE.CylinderGeometry(0.010, 0.011, 0.05, 12);
				segGeo.rotateZ(Math.PI / 2);

				function joint(segLen) {
					const j = new THREE.Group();
					const m = new THREE.Mesh(segGeo, matFinger);
					m.scale.set(1, 1, segLen / 0.05);
					m.position.x = segLen * 0.5;
					j.add(m);
					return j;
				}

				const j1 = joint(isThumb ? 0.045 : 0.05);
				const j2 = joint(isThumb ? 0.04 : 0.045);
				const j3 = joint(isThumb ? 0.035 : 0.04);

				root.add(j1);
				j1.position.x = 0.0;
				j1.add(j2);
				j2.position.x = isThumb ? 0.045 : 0.05;
				j2.add(j3);
				j3.position.x = isThumb ? 0.04 : 0.045;

				return [j1, j2, j3, root];
			}

			// four fingers
			for (let i = 0; i < 4; i++) {
				const base = new THREE.Vector3(fingerBaseX[i], 0.015, -0.025);
				const [j1, j2, j3] = makeFinger(base, false);
				fingers.push({ name: fingerNames[i], joints: [j1, j2, j3] });
			}

			// thumb (angled)
			{
				const base = new THREE.Vector3(-0.07, 0.0, 0.03);
				const [j1, j2, j3, root] = makeFinger(base, true);
				root.rotation.y = -0.8;
				root.rotation.z = -0.5;
				fingers.unshift({ name: "thumb", joints: [j1, j2, j3] }); // thumb at index 0
			}

			function setFingerCurl(fingerName, curl01) {
				const f = fingers.find(x => x.name === fingerName);
				if (!f) return;
				const curl = THREE.MathUtils.clamp(curl01, 0, 1);
				// curl around Z to fold toward palm
				const a1 = -1.0 * curl;
				const a2 = -1.1 * curl;
				const a3 = -0.9 * curl;
				f.joints[0].rotation.z = a1;
				f.joints[1].rotation.z = a2;
				f.joints[2].rotation.z = a3;
			}

			function setCount(n) {
				// common counting: 1=index, 2=+middle, 3=+ring, 4=+pinky, 5=+thumb
				const extended = new Set();
				if (n >= 1) extended.add("index");
				if (n >= 2) extended.add("middle");
				if (n >= 3) extended.add("ring");
				if (n >= 4) extended.add("pinky");
				if (n >= 5) extended.add("thumb");

				for (const f of fingers) {
					setFingerCurl(f.name, extended.has(f.name) ? 0.0 : 1.0);
				}
			}

			return { group: g, setCount };
		}

		const demoHand = createDemoHand();
		scene.add(demoHand.group);

		let manualDemoCount = null;
		window.addEventListener("keydown", (e) => {
			const k = e.key;
			if (k >= "1" && k <= "5") manualDemoCount = Number(k);
			if (k === "0") manualDemoCount = 0;
		});

		// --- Finger counting helpers (XR joint-based heuristic) ---
		const _a = new THREE.Vector3();
		const _b = new THREE.Vector3();
		const _c = new THREE.Vector3();

		function getJointWorldPos(hand, jointName, outVec3) {
			const j = hand.joints?.[jointName];
			if (!j) return null;
			return j.getWorldPosition(outVec3);
		}

		function fingerExtended(hand, tipName, proximalName, wristName = "wrist") {
			const tip = getJointWorldPos(hand, tipName, _a);
			const prox = getJointWorldPos(hand, proximalName, _b);
			const wrist = getJointWorldPos(hand, wristName, _c);
			if (!tip || !prox || !wrist) return false;

			// Extended if tip is notably farther from wrist than proximal joint is.
			const dTip = tip.distanceTo(wrist);
			const dProx = prox.distanceTo(wrist);
			return (dTip - dProx) > 0.035; // ~3.5cm threshold; tweak if needed
		}

		function countFingers(hand) {
			if (!hand?.joints) return null;

			let n = 0;

			// Thumb
			if (fingerExtended(hand, "thumb-tip", "thumb-phalanx-proximal")) n++;

			// Index
			if (fingerExtended(hand, "index-finger-tip", "index-finger-phalanx-proximal")) n++;

			// Middle
			if (fingerExtended(hand, "middle-finger-tip", "middle-finger-phalanx-proximal")) n++;

			// Ring
			if (fingerExtended(hand, "ring-finger-tip", "ring-finger-phalanx-proximal")) n++;

			// Pinky
			if (fingerExtended(hand, "pinky-finger-tip", "pinky-finger-phalanx-proximal")) n++;

			return n;
		}

		renderer.setAnimationLoop(() => {
			const inXR = renderer.xr.isPresenting;

			if (inXR) {
				demoHand.group.visible = false;
				hudMode.textContent = "Mode: XR hand-tracking (XRHandMeshModel)";
				const n = countFingers(hand1);
				hudCount.textContent = (n == null) ? "–" : String(n);
			} else {
				demoHand.group.visible = true;
				hudMode.textContent = "Mode: Non‑XR demo (press 1–5 to set, or watch auto)";
				const t = performance.now();
				const auto = (Math.floor(t / 1200) % 5) + 1; // 1..5
				const n = (manualDemoCount ?? auto);
				demoHand.setCount(n);
				hudCount.textContent = String(n);
				controls.update();
			}

			renderer.render(scene, camera);
		});

		window.addEventListener("resize", () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		});
	</script>
</body>
</html>
