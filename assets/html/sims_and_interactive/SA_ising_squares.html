function hamiltonian(){

  var E = 0;

  for (var ind=0; ind<spins_dat_squares.length; ind++){

    var x = spins_dat_squares[ind].x;
    var y = spins_dat_squares[ind].y;
    var s = spins_dat_squares[ind].state;

    if (x > 0){
      E += -spins_dict_squares[x-1][y]*s;
    }
    if (x < N_spins_squares-1){
      E += -spins_dict_squares[x+1][y]*s;
    }
    if (y > 0){
      E += -spins_dict_squares[x][y-1]*s;
    }
    if (y < N_spins_squares-1){
      E += -spins_dict_squares[x][y+1]*s;
    }

  }

  return E;
}


function flip_state_squares(){
  var ind = Math.round(Math.random()*(N_spins_squares*N_spins_squares - 1));

  var x = spins_dat_squares[ind].x;
  var y = spins_dat_squares[ind].y;
  var s = spins_dat_squares[ind].state;

  var E_switch = 0;
  if (x > 0){
    E_switch += spins_dict_squares[x-1][y]*s;
  }
  if (x < N_spins_squares-1){
    E_switch += spins_dict_squares[x+1][y]*s;
  }
  if (y > 0){
    E_switch += spins_dict_squares[x][y-1]*s;
  }
  if (y < N_spins_squares-1){
    E_switch += spins_dict_squares[x][y+1]*s;
  }



  T_squares = slider_temp_ising_squares.value()*T_squares;
  T_history_squares.push({
      index: T_history_squares[T_history_squares.length - 1].index + 1,
      x: T_history_squares[T_history_squares.length - 1].x + 1,
      y: T_squares
    });

  var p_mut = Math.exp(-E_switch/T_squares);

  if (p_mut > Math.random()){

    spins_dat_squares[ind].state = s*-1;
    spins_dict_squares[x][y] = spins_dat_squares[ind].state;
    //svg_ising_squares.selectAll('g').selectAll('path')
    svg_ising_squares.selectAll('g')
      .filter(function (d, i) {return i === ind;})
      .selectAll('path')
      .style("fill", function (d){ if(d.state==1){return down_col;}else{return up_col;}})
      .each(square);

    E_tot_squares += E_switch;
  }


  E_history_squares.push({
      index: E_history_squares[E_history_squares.length - 1].index + 1,
      x: E_history_squares[E_history_squares.length - 1].x + 1,
      y: E_tot_squares
    });


  //console.log(E_history_squares);
  plot_E_squares.select('path').attr('d', line_E_squares);

  x_E_squares.domain(d3.extent(E_history_squares.map(el => el.x)));
  svg_E_squares.select(".x")
    .call(xAxis_E_squares);

  y_E_squares.domain(d3.extent(E_history_squares.map(el => el.y)));
  svg_E_squares.select(".y")
    .call(yAxis_E_squares);

  plot_T_squares.select('path').attr('d', line_T_squares);
  x_T_squares.domain(d3.extent(T_history_squares.map(el => el.x)));
  svg_T_squares.select(".x")
    .call(xAxis_T_squares);

  y_T_squares.domain(d3.extent(T_history_squares.map(el => el.y)));
  svg_T_squares.select(".y")
    .call(yAxis_T_squares);

  text_T_squares.text( function(d){
    if (d.label == 'status'){
      return ('T = ' + T_squares.toExponential(3));
    }
    else{
      return d.txt;
    }
  })


  text_E_squares.text( function(d){
    if (d.label == 'status'){
      return ('Total energy = ' + E_tot_squares.toFixed(1));
    }
    else{
      return d.txt;
    }
  })


}



function run_sim_ising_squares(){

  var delay_amount = trans_dur;

  for (i=0; i<N_flips_squares; i++){
    //spins_dat_squares[i].state = spins_dat_squares[i].state*-1;
    setTimeout(flip_state_squares, delay_amount * i);
    //flip_state_squares();
  }
}


function reset_sim_ising_squares(){

  }

  E_tot_squares = hamiltonian();

      x: 0,
      y: E_tot_squares
    }];

      x: 0,
      y: T_init_squares
    }];

  svg_ising_squares.selectAll('g').selectAll('path')

    .each(square);

    x_E_squares.domain(d3.extent(E_history_squares.map(el => el.x)));
    svg_E_squares.select(".x")
      .call(xAxis_E_squares);

    y_E_squares.domain(d3.extent(E_history_squares.map(el => el.y)));
    svg_E_squares.select(".y")
      .call(yAxis_E_squares);

    plot_T_squares.select('path').attr('d', line_T_squares);
    x_T_squares.domain(d3.extent(T_history_squares.map(el => el.x)));
    svg_T_squares.select(".x")
      .call(xAxis_T_squares);

    y_T_squares.domain(d3.extent(T_history_squares.map(el => el.y)));
    svg_T_squares.select(".y")
      .call(yAxis_T_squares);


    plot_E_squares.select("path")
        .datum(E_history_squares)
        .attr("fill", "none")
        .attr("stroke", "mediumseagreen")
        .attr("stroke-linejoin", "round")
        .attr("stroke-linecap", "round")
        .attr("stroke-width", 2.5)
        .attr("d", line_E_squares);

    plot_T_squares.select("path")
        .datum(T_history_squares)
        .attr("fill", "none")
        .attr("stroke", "tomato")
        .attr("stroke-linejoin", "round")
        .attr("stroke-linecap", "round")
        .attr("stroke-width", 2.5)
        .attr("d", line_T_squares);


  text_T_squares.text( function(d){
    if (d.label == 'status'){
      return ('T = ' + T_squares.toExponential(3));
    }
    else{
      return d.txt;
    }
  })


  text_E_squares.text( function(d){
    if (d.label == 'status'){
      return ('Total energy = ' + E_tot_squares.toFixed(1));
    }
    else{
      return d.txt;
    }
  })

}


function reset_spins_squares(){

  var spins_dat_squares = [];
  var spins_dict_squares = {};
  for (i=0; i<N_spins_squares; i++){
    spins_dict_squares[i] = {};
    for (j=0; j<N_spins_squares; j++){
      var exp = Math.round(20*Math.random());
      var s = Math.pow(-1, exp);
      spins_dat_squares.push({
        x : i,
        y : j,
        state : s
      })

      spins_dict_squares[i][j] = s;

    }
  }

  return [spins_dat_squares, spins_dict_squares];

}
