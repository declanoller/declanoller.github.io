<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Blog Reader (WebGL + CSS3D iframe)</title>

  <!-- IMPORTANT:
       If you're serving this from Jekyll, put this file somewhere it can be loaded as a page.
       This uses ES modules from unpkg (no build step). -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0f14;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    /* Two layers: WebGL under, CSS3D over */
    #webgl, #css3d {
      position: fixed;
      inset: 0;
    }

    #webgl canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* CSS3D renderer writes into this */
    #css3d {
      pointer-events: none; /* default: let mouse go to WebGL */
    }

    /* HUD */
    #hud {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      user-select: none;
    }

    .pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(10, 14, 20, 0.72);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      max-width: min(520px, calc(100vw - 24px));
    }

    .pill b { font-weight: 650; }
    .pill kbd {
      font: 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.14);
    }

    .btn {
      pointer-events: auto;
      appearance: none;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.92);
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn:hover { background: rgba(255,255,255,0.14); }
    .btn:active { transform: translateY(1px); }

    /* The "screen" DOM element that becomes a CSS3DObject */
    .post-screen {
      width: 1200px;     /* CSS pixels; bigger => crisper text */
      height: 760px;
      background: rgba(250, 250, 250, 1);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.40);
      border: 1px solid rgba(0,0,0,0.10);
    }

    .post-screen iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    /* In "read mode" we allow pointer events on CSS3D layer */
    body.read-mode #css3d {
      pointer-events: auto;
      cursor: default;
    }

    /* Nice: when not in read mode, show a subtle crosshair */
    #crosshair {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 9;
      pointer-events: none;
      opacity: 0.7;
    }
    #crosshair::before {
      content: "";
      width: 10px; height: 10px;
      border-left: 2px solid rgba(255,255,255,0.55);
      border-top: 2px solid rgba(255,255,255,0.55);
      transform: rotate(45deg);
      border-radius: 1px;
      opacity: 0; /* only show when not reading */
    }
    body:not(.read-mode) #crosshair::before { opacity: 1; }

    /* Optional: dim world slightly when reading */
    #dimmer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.20);
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms ease;
    }
    body.read-mode #dimmer { opacity: 1; }
  </style>
</head>

<body>
  <div id="webgl"></div>
  <div id="dimmer"></div>
  <div id="css3d"></div>

  <div id="crosshair"></div>

  <div id="hud">
    <div class="pill" id="statusPill">
      <b>Mode:</b> <span id="modeText">Move</span>
      <span style="opacity:.85">|</span>
      <span id="helpText">
        Click the post to <b>read</b>, press <kbd>Esc</kbd> to <b>move</b>.
      </span>
    </div>
    <div class="pill" style="gap:8px;">
      <button class="btn" id="resetBtn" title="Reset camera">Reset view</button>
      <button class="btn" id="toggleBtn" title="Toggle read/move">Toggle mode</button>
    </div>
  </div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS3DRenderer, CSS3DObject } from "three/addons/renderers/CSS3DRenderer.js";

/**
 * CONFIG: Hardcode your blog post URL here.
 * Use a same-origin URL (recommended) so it behaves consistently.
 */
const BLOG_POST_URL = "https://declanoller.github.io/iql_1"; // <-- CHANGE ME

// --- DOM containers
const webglRoot = document.getElementById("webgl");
const css3dRoot = document.getElementById("css3d");
const modeText = document.getElementById("modeText");
const resetBtn = document.getElementById("resetBtn");
const toggleBtn = document.getElementById("toggleBtn");

// --- Three.js scenes
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f14);

const cssScene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.05, 200);
camera.position.set(0, 1.45, 4.2);

// --- WebGL renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
webglRoot.appendChild(renderer.domElement);

// --- CSS3D renderer
const cssRenderer = new CSS3DRenderer();
cssRenderer.setSize(window.innerWidth, window.innerHeight);
cssRenderer.domElement.style.position = "absolute";
cssRenderer.domElement.style.top = "0";
cssRenderer.domElement.style.left = "0";
css3dRoot.appendChild(cssRenderer.domElement);

// --- Controls (movement)
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 1.0;
controls.maxDistance = 12.0;
controls.target.set(0, 1.3, 0);

// --- Simple environment (floor + walls-ish + lights)
{
  const hemi = new THREE.HemisphereLight(0xffffff, 0x203050, 0.85);
  scene.add(hemi);

  const dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(3, 6, 2);
  scene.add(dir);

  // Floor
  const floorGeo = new THREE.PlaneGeometry(60, 60);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x101722, roughness: 0.98, metalness: 0.0 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0;
  scene.add(floor);

  // A few simple shapes for depth cues
  const mat1 = new THREE.MeshStandardMaterial({ color: 0x22314a, roughness: 0.85 });
  const mat2 = new THREE.MeshStandardMaterial({ color: 0x2b3e5f, roughness: 0.75 });
  const mat3 = new THREE.MeshStandardMaterial({ color: 0x1f2a3d, roughness: 0.9 });

  const box1 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), mat1);
  box1.position.set(-2.2, 0.6, -1.2);
  scene.add(box1);

  const box2 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.4, 0.8), mat2);
  box2.position.set(2.2, 1.2, -2.4);
  scene.add(box2);

  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1.4, 32), mat3);
  cyl.position.set(0.0, 0.7, -3.0);
  scene.add(cyl);
}

// --- Create the blog post "screen" as DOM and mount it into CSS3D
function makePostScreen() {
  const screen = document.createElement("div");
  screen.className = "post-screen";

  const iframe = document.createElement("iframe");
  iframe.src = BLOG_POST_URL;
  iframe.loading = "eager";
  iframe.referrerPolicy = "no-referrer-when-downgrade";
  // iframe.sandbox = ""; // optional; usually you *don't* want sandbox for your own site
  screen.appendChild(iframe);

  // Helpful: prevent accidental drag selections from interfering with 3D
  screen.addEventListener("dragstart", (e) => e.preventDefault());

  return { screen, iframe };
}

const { screen: postEl, iframe: postIframe } = makePostScreen();

const postObj = new CSS3DObject(postEl);
postObj.position.set(0, 1.55, 0);      // place it at eye height
postObj.rotation.set(0, 0, 0);         // facing camera-ish initially
postObj.scale.setScalar(0.00135);      // converts CSS px -> world units; tune for size
cssScene.add(postObj);

// --- Add an invisible WebGL plane for *rough* depth cue + optional ray hits
// This plane is not used for true occlusion (CSS3D can't be occluded automatically),
// but we can use it for picking to enter read mode.
const hitPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(1.62, 1.02), // approx size of the post in world units; tune with scale above
  new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.0 })
);
hitPlane.position.copy(postObj.position);
hitPlane.quaternion.copy(postObj.quaternion);
scene.add(hitPlane);

// --- Interaction: click the screen to enter "read mode"
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();

// read mode toggles
let readMode = false;

function setReadMode(on) {
  readMode = on;
  document.body.classList.toggle("read-mode", readMode);

  // Enable pointer events on CSS3D layer only when reading
  // (CSS3D layer already set via body.read-mode #css3d { pointer-events: auto; })
  controls.enabled = !readMode;

  // Update HUD
  modeText.textContent = readMode ? "Read" : "Move";

  // When entering read mode, focus the iframe so wheel/keys scroll it
  if (readMode) {
    // Give it a tick so browser can route focus
    setTimeout(() => {
      try { postIframe.contentWindow?.focus(); } catch {}
    }, 0);
  } else {
    // Focus back to document so Escape works etc.
    window.focus();
  }
}

function toggleMode() {
  setReadMode(!readMode);
}

// Click-to-read (only when not already reading)
function onPointerDown(e) {
  if (readMode) return;

  // Compute NDC
  const rect = renderer.domElement.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const y = -(((e.clientY - rect.top) / rect.height) * 2 - 1);
  mouseNDC.set(x, y);

  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObject(hitPlane, false);

  if (hits.length > 0) {
    setReadMode(true);
  }
}

renderer.domElement.addEventListener("pointerdown", onPointerDown);

// Escape to exit read mode
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && readMode) {
    setReadMode(false);
  } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    // Handy toggle shortcut: Ctrl/Cmd+Enter
    toggleMode();
  }
});

// Buttons
resetBtn.addEventListener("click", () => {
  controls.target.set(0, 1.3, 0);
  camera.position.set(0, 1.45, 4.2);
  controls.update();
});

toggleBtn.addEventListener("click", toggleMode);

// Keep hitPlane aligned with the CSS3D object (in case you move/animate it later)
function syncHitPlane() {
  hitPlane.position.copy(postObj.position);
  hitPlane.quaternion.copy(postObj.quaternion);
}

// Resize handling
window.addEventListener("resize", () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  cssRenderer.setSize(w, h);
});

// Animation loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  syncHitPlane();
  renderer.render(scene, camera);
  cssRenderer.render(cssScene, camera);
}
animate();

</script>
</body>
</html>
